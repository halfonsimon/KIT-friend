# Weekly dependency updates, opened as PRs into develop.
# Minor and patch bumps are grouped into one PR per ecosystem; majors come separately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (via eslint-config-next) only supports TypeScript <6.1;
      # remove once it supports a newer major.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

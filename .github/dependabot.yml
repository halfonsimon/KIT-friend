# Weekly dependency updates, opened as PRs into develop.
# Minor and patch bumps are grouped into one PR per ecosystem; majors come separately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

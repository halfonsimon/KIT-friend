# Runs on every push to develop and every PR to main or develop (e.g. Dependabot).
# Four parallel jobs, each its own check: checks, db-tests, build, e2e.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # coverage summary comment
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit_friend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kit -d kit_friend_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://kit:kit@localhost:5432/kit_friend_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Full suite (unit + db) so the coverage report covers both projects.
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        continue-on-error: true # Dependabot PRs get a read-only token
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: app
          file-coverage-mode: all
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    # Dummy values: the build must not need real secrets.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-auth-secret
      AUTH_GOOGLE_ID: ci-dummy-google-id
      AUTH_GOOGLE_SECRET: ci-dummy-google-secret
      CRON_SECRET: ci-dummy-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Host ports stay below Linux's ephemeral range (32768-60999): a fixed port
    # inside it can already be taken by an outgoing connection, and the service
    # container then fails to start ("address already in use").
    env:
      E2E_DATABASE_URL: postgresql://kit:kit@localhost:5432/kit_friend_e2e_test
      MAILPIT_URL: http://localhost:8025
      MAILPIT_SMTP_PORT: "1025"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kit
          POSTGRES_PASSWORD: kit
          POSTGRES_DB: kit_friend_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kit -d kit_friend_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 14

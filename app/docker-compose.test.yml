# Throwaway Postgres for database-backed tests (`npm run test:db:up`).
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: kit
      POSTGRES_DB: kit_friend_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kit -d kit_friend_test"]
      interval: 1s
      timeout: 3s
      retries: 30

# Throwaway services for tests (`npm run test:db:up`):
# Postgres for the db and end-to-end tests, Mailpit to catch the end-to-end tests' email.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: kit
      POSTGRES_DB: kit_friend_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kit -d kit_friend_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  # SMTP on 54325, web UI and API on http://localhost:54380. Accepts any login
  # over plain SMTP, because the digest route requires SMTP_USER/SMTP_PASS.
  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "54325:1025"
      - "54380:8025"
